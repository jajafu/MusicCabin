<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicCabin · 傳照片與點歌</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101827; color: #f2f6ff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px 64px; }
    main { max-width: 560px; margin: auto; }
    h1 { font-size: 1.7rem; margin: 12px 0 4px; }
    p { color: #c8d4e8; line-height: 1.55; }
    .card { background: #1d2c42; border: 1px solid #354965; border-radius: 20px; padding: 20px; margin-top: 20px; }
    label { display: block; margin: 16px 0 6px; font-weight: 650; }
    input[type="file"] { width: 100%; min-height: 50px; border-radius: 10px; border: 2px solid #7187a5; background: #101827; color: white; padding: 12px; font-size: 1.05rem; }
    input:focus-visible, button:focus-visible { outline: 3px solid #76c5ff; outline-offset: 3px; }
    button { width: 100%; min-height: 54px; margin-top: 22px; border: 0; border-radius: 12px; background: #83c5ff; color: #0d263c; font-size: 1.05rem; font-weight: 700; }
    button:disabled { opacity: .5; }
    #status { white-space: pre-wrap; min-height: 2em; }
    .hint { font-size: .92rem; }
    .tabs { display: flex; gap: 8px; margin-top: 4px; }
    .tab { min-height: 48px; margin-top: 0; border: 2px solid #354965; border-radius: 12px; background: #1d2c42; color: #c8d4e8; font-weight: 700; }
    .tab.active { background: #83c5ff; border-color: #83c5ff; color: #0d263c; }
    .field-label { margin: 0 0 6px; }
    #query { width: 100%; min-height: 50px; border-radius: 10px; border: 2px solid #7187a5; background: #101827; color: white; padding: 12px; font-size: 1.05rem; }
    .song-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid #273952; }
    .song-row:first-child { border-top: 0; }
    .song-row .song-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .song-row .thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex: none; background: #101827; }
    .song-row .meta { flex: 1; min-width: 0; }
    .song-row .title { margin: 0; color: #f2f6ff; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .song-row .sub { margin: 0; color: #9fb2cc; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .song-row .ops { display: flex; gap: 8px; flex: none; flex-wrap: wrap; margin-left: 60px; }
    .song-row.current .title { color: #83c5ff; }
    .badge { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 999px; background: #27425f; color: #9fd0ff; font-size: .75rem; vertical-align: middle; }
    button.row-btn { width: auto; min-height: 38px; margin: 0; padding: 6px 12px; font-size: .9rem; border-radius: 10px; background: #27425f; color: #cfe4ff; }
    button.row-btn.primary { background: #83c5ff; color: #0d263c; }
    button.row-btn.danger { background: #3b2430; color: #ff9db1; }
    .empty { color: #9fb2cc; }
  </style>
</head>
<body>
<main>
  <nav class="tabs" aria-label="功能分頁">
    <button id="tab-photos" class="tab active" type="button" aria-pressed="true">傳照片</button>
    <button id="tab-songs" class="tab" type="button" aria-pressed="false">點歌</button>
  </nav>
  <section id="page-photos">
    <h1>傳送照片到 MusicCabin 相框</h1>
    <p>手機與接收裝置連上同一區域網路（也可使用手機熱點）。相框畫面開啟期間，傳照片與點歌服務都會持續運行；離開相框畫面後服務才會停止。照片只會經區域網路直接傳到這台裝置。</p>
    <div class="card">
      <label for="photos">選擇手機或雲端硬碟中的照片</label>
      <input id="photos" type="file" accept="image/*" multiple>
      <p class="hint">若手機的檔案選擇器有顯示 Google Drive 等雲端來源，可直接從那裡選取；若沒有，先在雲端硬碟 App 下載照片到手機再選。</p>
      <button id="send" type="button">壓縮並傳送照片</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <p class="hint">每張照片會在手機縮至最長邊 1920 像素並壓縮至 2 MB 以下。再次傳送會累加；可在接收裝置清空手機傳入的照片。</p>
  </section>
  <section id="page-songs" hidden>
    <h1>點歌</h1>
    <p>搜尋歌曲後插播或加到待播清單；清單與播放狀態每 10 秒自動更新。</p>
    <p id="song-connection" class="hint" role="status" aria-live="polite">正在連線到相框…</p>
    <div class="card">
      <p class="field-label"><span class="badge">目前播放</span><span id="now-title">—</span></p>
      <p class="sub" id="now-artists">尚未播放</p>
    </div>
    <div class="card">
      <label class="field-label" for="query">搜尋歌曲</label>
      <input id="query" type="search" placeholder="輸入歌名或歌手" autocomplete="off" enterkeyhint="search">
      <button id="search" type="button">搜尋</button>
      <div id="results"></div>
    </div>
    <div class="card">
      <p class="field-label">待播清單</p>
      <div id="queue"></div>
    </div>
  </section>
</main>
<script>
(() => {
  const photosField = document.getElementById('photos');
  const sendButton = document.getElementById('send');
  const status = document.getElementById('status');
  const setStatus = text => { status.textContent = text; };

  async function bitmapFor(file) {
    if (window.createImageBitmap) return createImageBitmap(file);
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
      image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取這張照片。')); };
      image.src = url;
    });
  }

  async function compress(file) {
    const bitmap = await bitmapFor(file);
    try {
      const width = bitmap.width || bitmap.naturalWidth;
      const height = bitmap.height || bitmap.naturalHeight;
      const ratio = Math.min(1, 1920 / Math.max(width, height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(width * ratio));
      canvas.height = Math.max(1, Math.round(height * ratio));
      const context = canvas.getContext('2d');
      if (!context) throw new Error('瀏覽器無法壓縮照片。');
      context.fillStyle = '#fff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      for (const quality of [0.8, 0.65, 0.5, 0.35]) {
        const result = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
        if (result && result.size <= 2 * 1024 * 1024) return result;
      }
      throw new Error('壓縮後仍超過 2 MB，請改選較小的照片。');
    } finally { if (bitmap.close) bitmap.close(); }
  }

  sendButton.addEventListener('click', async () => {
    const files = [...photosField.files];
    if (!files.length) { setStatus('請先選擇照片。'); return; }
    sendButton.disabled = true;
    let complete = 0;
    try {
      for (const file of files) {
        setStatus(`正在壓縮並傳送 ${complete + 1} / ${files.length} 張…`);
        const image = await compress(file);
        const response = await fetch('/photo', {
          method: 'POST',
          headers: {
            'Content-Type': 'image/jpeg',
            'X-Photo-Name': encodeURIComponent(file.name)
          },
          body: image
        });
        if (!response.ok) throw new Error(`接收裝置未收到「${file.name}」（${response.status}）：${await response.text()}`);
        complete++;
      }
      setStatus(`完成：已傳送 ${complete} 張。回到接收裝置即可檢視相框照片。`);
      photosField.value = '';
    } catch (error) {
      setStatus(`已傳送 ${complete} 張；${error.message}`);
    } finally { sendButton.disabled = false; }
  });

  // ----- 分頁切換 -----
  const tabPhotos = document.getElementById('tab-photos');
  const tabSongs = document.getElementById('tab-songs');
  const pagePhotos = document.getElementById('page-photos');
  const pageSongs = document.getElementById('page-songs');
  function showSongs(show) {
    pageSongs.hidden = !show;
    pagePhotos.hidden = show;
    tabSongs.classList.toggle('active', show);
    tabPhotos.classList.toggle('active', !show);
    tabSongs.setAttribute('aria-pressed', String(show));
    tabPhotos.setAttribute('aria-pressed', String(!show));
    if (show) { refreshState(); runSearch(); }
  }
  tabPhotos.addEventListener('click', () => showSongs(false));
  tabSongs.addEventListener('click', () => showSongs(true));

  // ----- 點歌：狀態與搜尋 -----
  const songConnection = document.getElementById('song-connection');
  const nowTitle = document.getElementById('now-title');
  const nowArtists = document.getElementById('now-artists');
  const queryField = document.getElementById('query');
  const searchButton = document.getElementById('search');
  const resultsBox = document.getElementById('results');
  const queueBox = document.getElementById('queue');

  function formatDuration(seconds) {    if (seconds == null || seconds <= 0) return '--:--';
    const total = Math.round(seconds);
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
  }

  function songRow(song, buttons) {
    const row = document.createElement('div');
    row.className = 'song-row';
    const main = document.createElement('div');
    main.className = 'song-main';
    const thumb = document.createElement('img');
    thumb.className = 'thumb';
    if (song.thumbnail) { thumb.src = song.thumbnail; thumb.referrerPolicy = 'no-referrer'; }
    thumb.alt = '';
    const meta = document.createElement('div');
    meta.className = 'meta';
    const title = document.createElement('p');
    title.className = 'title';
    title.textContent = song.title || '（無標題）';
    const sub = document.createElement('p');
    sub.className = 'sub';
    sub.textContent = `${song.artists || '未知歌手'} · ${formatDuration(song.duration)}`;
    meta.append(title, sub);
    main.append(thumb, meta);
    row.append(main);
    if (buttons.length) {
      const ops = document.createElement('div');
      ops.className = 'ops';
      for (const button of buttons) ops.append(button);
      row.append(ops);
    }
    return row;
  }

  function rowButton(label, primary, onClick) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `row-btn${primary ? ' primary' : ''}`;
    button.textContent = label;
    button.addEventListener('click', onClick);
    return button;
  }

  async function postJson(url, payload) {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!response.ok) {
      const text = await response.text().catch(() => '');
      throw new Error(text || `操作失敗（${response.status}）`);
    }
  }

  function reportActionError(error) {
    if (error.name === 'AbortError') return;
    setStatusSongs(`${error.name === 'TypeError' ? '無法連線到相框。' : (error.message || '操作失敗。')}`);
  }

  /** POST then refresh; the refreshed queue replaces the row buttons. */
  async function queueAction(url, payload, event) {
    const button = event.currentTarget;
    button.disabled = true;
    try {
      await postJson(url, payload);
      await refreshState();
    } catch (error) {
      reportActionError(error);
      button.disabled = false;
    }
  }

  function setStatusSongs(text) {
    songConnection.textContent = text;
  }

  function renderState(state) {
    setStatusSongs('已連線到相框；每 10 秒自動更新。');
    const now = state.nowPlaying;
    nowTitle.textContent = now ? now.title : '—';
    nowArtists.textContent = now ? `${now.artists || '未知歌手'} · ${formatDuration(now.duration)}` : '尚未播放';
    queueBox.textContent = '';
    const queue = state.queue || [];
    if (now) {
      const current = songRow(now, []);
      current.classList.add('current');
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '播放中';
      current.querySelector('.title').prepend(badge);
      queueBox.append(current);
    }
    if (!queue.length) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = now ? '待播清單沒有歌曲；搜尋後插播或加到最後。' : '目前沒有播放任何歌曲。';
      queueBox.append(empty);
      return;
    }
    for (const [position, song] of queue.entries()) {
      const buttons = [];
      if (position > 0) {
        buttons.push(rowButton('↑', false, async event =>
          queueAction('/move', { from: song.index, to: song.index - 1 }, event)));
      }
      if (position < queue.length - 1) {
        buttons.push(rowButton('↓', false, async event =>
          queueAction('/move', { from: song.index, to: song.index + 1 }, event)));
      }
      buttons.push(rowButton('移除', false, async event =>
        queueAction('/remove', { index: song.index, videoId: song.videoId }, event)));
      queueBox.append(songRow(song, buttons));
    }
  }

  async function refreshState() {
    try {
      const response = await fetch('/state');
      if (response.status === 503) {
        setStatusSongs('相框的播放器尚未就緒；每 10 秒會自動重試。');
        return;
      }
      if (!response.ok) throw new Error(`狀態取得失敗（${response.status}）`);
      renderState(await response.json());
    } catch (error) {
      setStatusSongs('無法連線到相框；請確認相框畫面仍開啟，每 10 秒會自動重試。');
    }
  }

  let searchController = null;
  let searchTimer = null;

  async function runSearch() {
    const query = queryField.value.trim();
    if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
    if (searchController) searchController.abort();
    searchController = new AbortController();
    const controller = searchController;
    resultsBox.textContent = '';
    if (!query) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = '輸入歌名或歌手後按搜尋。';
      resultsBox.append(empty);
      return;
    }
    searchButton.disabled = true;
    try {
      const response = await fetch(`/search?q=${encodeURIComponent(query)}`, { signal: controller.signal });
      if (!response.ok) throw new Error(`搜尋失敗（${response.status}）`);
      const { songs } = await response.json();
      if (controller !== searchController) return;
      if (!songs.length) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = '找不到符合的歌曲。';
        resultsBox.append(empty);
        return;
      }
      for (const song of songs) {
        const playNext = rowButton('插播', true, async event =>
          queueAction('/play-next', { videoId: song.videoId }, event));
        const addEnd = rowButton('加到最後', false, async event =>
          queueAction('/add-end', { videoId: song.videoId }, event));
        resultsBox.append(songRow(song, [playNext, addEnd]));
      }
    } catch (error) {
      if (error.name !== 'AbortError') {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = error.name === 'TypeError' ? '無法連線到相框。' : (error.message || '搜尋失敗。');
        resultsBox.append(empty);
      }
    } finally {
      if (controller === searchController) searchButton.disabled = false;
    }
  }

  searchButton.addEventListener('click', runSearch);
  queryField.addEventListener('keydown', event => { if (event.key === 'Enter') runSearch(); });
  queryField.addEventListener('input', () => {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 600);
  });

  setInterval(() => {
    if (document.hidden || pageSongs.hidden) return;
    refreshState();
  }, 10000);
})();
</script>
</body>
</html>
